<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#161A25;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Grid app</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: edge-to-edge phone screen. Soft, borderless surfaces with big radii; circular day dots; avatar-style habit icons; bento tiles on Overview; floating pill menu. Colour themes change only the accent. */
:root {
  --a-l: #1E8A4B; --a-d: #4CC37F;
  --on-l: #FFFFFF; --on-d: #0B100D;
  --nm-bg: #E8ECF2; --nm-hi: #FFFFFF; --nm-lo: #C3CAD8;
  --bg-base: var(--nm-bg);
  --surface: var(--bg);
  --line: #E1E6E2;
  --fg: #141A16;
  --muted: #5F6B63;
  --accent: var(--a-l);
  --on-accent: var(--on-l);
  --bg: color-mix(in srgb, var(--accent) 6%, var(--bg-base));
  --accent-soft: color-mix(in srgb, var(--accent) 15%, var(--surface));
  --soft: color-mix(in srgb, var(--fg) 6%, var(--surface));
  --accent-2: color-mix(in srgb, var(--accent) 72%, #ffffff);
  --done: #2A9A58;
  --missed: #E0483D;
  --skip: #9DA6A0;
  --on-state: #FFFFFF;
  --danger: #C23A30;
  --shadow: 7px 7px 16px var(--nm-lo), -7px -7px 16px var(--nm-hi);
  --inset: inset 3px 3px 7px var(--nm-lo), inset -3px -3px 7px var(--nm-hi);
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-accent="ocean"]    { --a-l: #1F6FD1; --a-d: #5AA2F5; }
:root[data-accent="sunset"]   { --a-l: #D4531C; --a-d: #FF8A57; }
:root[data-accent="grape"]    { --a-l: #7A4DD6; --a-d: #A98BF5; }
:root[data-accent="rose"]     { --a-l: #C93A6E; --a-d: #F27AA3; }
:root[data-accent="graphite"] { --a-l: #2A332E; --a-d: #D5DDD7; }
:root[data-accent="neon"]     { --a-l: #0891B2; --a-d: #22D3EE; --accent-2: #8B5CF6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="light"]) {
    --nm-bg: #161A25; --nm-hi: #20263A; --nm-lo: #0B0E16; --bg-base: var(--nm-bg); --line: #2A3142; --fg: #E8EFE9; --muted: #94A298;
    --accent: var(--a-d); --on-accent: var(--on-d);
    --done: #4CC37F; --missed: #F0766C; --skip: #68746C; --on-state: #08130C; --danger: #F08278;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"] {
  --nm-bg: #161A25; --nm-hi: #20263A; --nm-lo: #0B0E16; --bg-base: var(--nm-bg); --line: #2A3142; --fg: #E8EFE9; --muted: #94A298;
  --accent: var(--a-d); --on-accent: var(--on-d);
  --done: #4CC37F; --missed: #F0766C; --skip: #68746C; --on-state: #08130C; --danger: #F08278;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 22px 116px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
#app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-height: calc(100dvh - 160px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
h1 { margin: 0; font-size: 42px; line-height: 1; font-weight: 800; letter-spacing: -0.045em; }
h2 { margin: 0; font-size: 26px; line-height: 1.12; font-weight: 800; letter-spacing: -0.03em; overflow-wrap: anywhere; }
h3 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.eyebrow { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn { min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--soft); font-weight: 700; }
.btn.primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--on-accent); }
.btn.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.btn.armed { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .35; cursor: default; }
.fab { flex: none; width: 58px; height: 58px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.fab svg, .tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.link { background: none; border: 0; color: var(--muted); font-weight: 700; padding: 6px 0; min-height: 40px; }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.note.warn { color: var(--danger); }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 16px; border-radius: 24px; background: var(--accent-soft); }
.panel { background: var(--surface); border-radius: 30px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }

/* tracking */
.prog { display: flex; flex-direction: column; gap: 10px; }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.big { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.pct { font-family: var(--font-mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 14px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 8%, transparent); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; transition: width .3s ease; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 20px; }
.dh { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.dh b { display: block; font-size: 15px; color: var(--fg); font-weight: 800; }
.dh.today b { color: var(--accent); }
#cards { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.card { flex: 1 1 auto; max-height: 220px; background: var(--surface); border-radius: 32px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; box-shadow: var(--shadow); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; width: 100%; text-align: left; background: none; border: 0; padding: 0; min-height: 44px; }
.who .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 18px; letter-spacing: -0.015em; line-height: 1.15; overflow-wrap: anywhere; }
.chip { flex: none; font-weight: 700; font-size: 12px; padding: 6px 11px; border-radius: 99px; background: var(--accent-soft); color: var(--fg); white-space: nowrap; }
.cells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cell { width: 100%; aspect-ratio: 1; padding: 0; border-radius: 50%; border: 0; background: var(--soft); color: var(--on-state); font-weight: 800; font-size: 17px; line-height: 1; transition: transform .12s ease; }
.cell:active { transform: scale(.9); }
.cell.s1 { background: linear-gradient(145deg, color-mix(in srgb, var(--done) 80%, #fff), var(--done)); box-shadow: 0 6px 12px -5px color-mix(in srgb, var(--done) 75%, transparent); }
.cell.s2 { background: linear-gradient(145deg, color-mix(in srgb, var(--missed) 80%, #fff), var(--missed)); box-shadow: 0 6px 12px -5px color-mix(in srgb, var(--missed) 75%, transparent); }
.cell.s3 { background: var(--skip); }
.cell.today { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 5px var(--accent); }
.cell:disabled { opacity: .3; cursor: default; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); justify-content: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.empty { flex: 1; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 24px; }

/* bottom menu */
.tabbar {
  position: fixed; z-index: 20; max-width: 480px; margin: 0 auto;
  left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border-radius: 999px; padding: 7px;
  box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .3), 0 0 0 1px color-mix(in srgb, var(--fg) 6%, transparent);
}
.tabbar nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; padding: 8px 4px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-size: 12px; font-weight: 700; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* stats, overview */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats > div { display: flex; flex-direction: column; gap: 2px; padding: 14px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); }
.stats dt { font-size: 12px; font-weight: 700; color: var(--muted); }
.stats dd { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stats.bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats.bento > div:first-child { grid-column: 1 / -1; padding: 20px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--on-accent); border-radius: 30px; }
.stats.bento > div:first-child dt { color: inherit; opacity: .85; font-size: 13px; }
.stats.bento > div:first-child dd { font-size: 46px; letter-spacing: -0.04em; }
.ov { display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: 28px; padding: 16px 18px; box-shadow: var(--shadow); }
.ov-top { display: flex; align-items: center; gap: 12px; }
.ov .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 17px; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.ov .pc { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.track { display: block; height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 8%, transparent); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; }
.ov .st { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* detail */
.back { align-self: flex-start; }
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cal-head .ttl { font-weight: 800; font-size: 17px; }
.cal-head .btn { min-width: 48px; padding: 0; font-size: 22px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
.cal .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.cal .cell { font-size: 15px; font-weight: 600; color: var(--fg); }
.cal .cell.s1, .cal .cell.s2, .cal .cell.s3 { color: var(--on-state); font-weight: 800; }
.cal .gap { aspect-ratio: 1; }

/* form */
form { display: flex; flex-direction: column; gap: 20px; }
label.f, .f { display: flex; flex-direction: column; gap: 10px; font-weight: 700; font-size: 14px; }
input[type="text"] { min-height: 54px; padding: 10px 18px; border: 0; border-radius: 20px; background: var(--soft); color: var(--fg); }
input[type="text"]:focus-visible { outline-offset: 0; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.sw { position: relative; }
.sw input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw span { display: block; width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; }
.sw input:checked + span { border-color: var(--fg); box-shadow: inset 0 0 0 3px var(--surface); }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
input[type="file"] { display: none; }

/* appearance */
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.theme { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 24px; border: 0; background: var(--soft); font-size: 13px; font-weight: 700; }
.theme i { width: 38px; height: 38px; border-radius: 50%; display: block; box-shadow: 0 6px 12px -5px rgba(0, 0, 0, .4); }
.theme[aria-pressed="true"] { background: var(--accent-soft); box-shadow: 0 0 0 2.5px var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 5px; border-radius: 999px; background: var(--soft); }
.seg button { min-height: 44px; border: 0; border-radius: 999px; background: none; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 4px 10px -4px rgba(0, 0, 0, .3); }
/* overview grids */
.pnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pnav .ttl { font-weight: 800; font-size: 16px; text-align: center; }
.pnav .btn { min-width: 48px; padding: 0; font-size: 22px; }
.ppct { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pgh { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.pgh span { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.pg { display: grid; gap: 6px; }
.pg.w, .pg.m { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.pg.q { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 4px; }
.ql { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 4px; }
.ql span { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.pcl { aspect-ratio: 1; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.pg.w .pcl { font-size: 16px; }
.pg.q .pcl { border-radius: 34%; }
.pcl.s1 { background: var(--done); color: var(--on-state); }
.pcl.s2 { background: var(--missed); color: var(--on-state); }
.pcl.s3 { background: var(--skip); color: var(--on-state); }
.pcl.fut { opacity: .4; }
.pcl.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.pcl.out { visibility: hidden; }
.cap { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.hlegend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); justify-content: flex-end; }
.hlegend i { width: 16px; height: 16px; border-radius: 50%; display: block; }
.hlegend span:first-child { margin-right: 2px; }
/* neumorphic layer: soft raised and pressed surfaces, neon accents, progress ring */
.btn { background: var(--bg); box-shadow: 5px 5px 12px var(--nm-lo), -5px -5px 12px var(--nm-hi); }
.btn:active { box-shadow: var(--inset); }
.btn.primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.fab { box-shadow: 0 10px 26px -6px color-mix(in srgb, var(--accent) 75%, transparent); }
.cell { background: var(--bg); box-shadow: var(--inset); }
.cell.s3 { box-shadow: none; }
.pcl { background: var(--bg); box-shadow: inset 2px 2px 4px var(--nm-lo), inset -2px -2px 4px var(--nm-hi); }
.pcl.s1, .pcl.s2, .pcl.s3 { box-shadow: none; }
.pcl.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.tabbar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: var(--shadow); }
.tab[aria-current="page"] { background: var(--bg); box-shadow: var(--inset); }
.theme { background: var(--bg); box-shadow: 4px 4px 10px var(--nm-lo), -4px -4px 10px var(--nm-hi); }
.theme[aria-pressed="true"] { background: var(--bg); box-shadow: var(--inset), 0 0 0 2px var(--accent); }
.seg { background: var(--bg); box-shadow: var(--inset); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--accent); box-shadow: 4px 4px 10px var(--nm-lo), -4px -4px 10px var(--nm-hi); }
input[type="text"] { background: var(--bg); box-shadow: var(--inset); }
.banner { background: var(--bg); box-shadow: var(--inset); }
.bar { background: var(--bg); box-shadow: var(--inset); }
.chip { background: var(--bg); box-shadow: var(--inset); }
.days.six, .cells.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.ringwrap { align-self: center; position: relative; width: min(68vw, 250px); aspect-ratio: 1; border-radius: 50%; background: var(--bg); box-shadow: var(--shadow); display: grid; place-items: center; margin: 2px 0 4px; }
.ringwrap svg { position: absolute; inset: 13px; width: calc(100% - 26px); height: calc(100% - 26px); transform: rotate(-90deg); overflow: visible; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 65%, transparent)); }
.ring-track { stroke: color-mix(in srgb, var(--fg) 9%, transparent); }
.ringin { width: 66%; aspect-ratio: 1; border-radius: 50%; box-shadow: var(--inset); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; }
.rpct { font-size: clamp(34px, 11vw, 48px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.rsub { font-size: 13px; font-weight: 600; color: var(--muted); }
.crow { display: flex; align-items: center; gap: 12px; }
.crow .who { flex: 1; width: auto; min-width: 0; }
.who .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.who .tx .nm { flex: none; }
.who .st { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.pill { flex: none; min-width: 108px; min-height: 46px; padding: 0 16px; border: 0; border-radius: 999px; font-weight: 800; font-size: 14px; color: var(--muted); background: var(--bg); box-shadow: 5px 5px 12px var(--nm-lo), -5px -5px 12px var(--nm-hi); }
.pill:active { box-shadow: var(--inset); }
.pill.s1 { background: linear-gradient(135deg, color-mix(in srgb, var(--done) 80%, #fff), var(--done)); color: var(--on-state); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--done) 80%, transparent); }
.pill.s2 { background: linear-gradient(135deg, color-mix(in srgb, var(--missed) 80%, #fff), var(--missed)); color: var(--on-state); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--missed) 80%, transparent); }
.pill.s3 { background: var(--skip); color: var(--on-state); box-shadow: none; }
/* size caps: circles stay phone-sized on wide screens */
.cells.six, .days.six { grid-template-columns: repeat(6, minmax(0, 40px)); justify-content: space-between; }
.pgh, .pg.w, .pg.m { grid-template-columns: repeat(7, minmax(0, 38px)); justify-content: space-between; }

        var low = isNum && hb.goal && it.v < hb.goal;
        var r = svgEl("rect", { x: x + gap / 2, y: T + ph - bh, width: Math.max(bw - gap, 1.5), height: bh, rx: Math.min(3, (bw - gap) / 2), style: "fill:" + hb.color + (low ? ";opacity:.5" : "") });
        svg.appendChild(r); it.el = r;
      }
      var hit = svgEl("rect", { x: x, y: T, width: bw, height: ph, fill: "transparent", style: "cursor:pointer" });
      hit.addEventListener("click", function () {
        readout.textContent = it.text;
        if (sel && sel.el) sel.el.style.stroke = "none";
        sel = it; if (it.el) { it.el.style.stroke = "var(--fg)"; it.el.style.strokeWidth = "1.5"; }
      });
      svg.appendChild(hit);
    });
    if (isNum && hb.goal) {
      svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: y(hb.goal), y2: y(hb.goal), class: "goal" }));
      var gt = svgEl("text", { x: W - R + 4, y: y(hb.goal) + 3, "text-anchor": "start", class: "gt" });
      gt.textContent = "goal " + fmtVal(hb.goal);
      svg.appendChild(gt);
    }
    var a = svgEl("text", { x: L, y: H - 5, "text-anchor": "start" }); a.textContent = items[0].label; svg.appendChild(a);
    var z = svgEl("text", { x: W - R, y: H - 5, "text-anchor": "end" }); z.textContent = isNum ? "Today" : "This week"; svg.appendChild(z);
    kids.push(h("div", { class: "panel" }, [head, seg, svg, readout]));
  }

  function detailView() {
    var hb = find(view.id);
    if (!hb) { view = { name: "list" }; return listView(); }
    var t = today(), tk = key(t);
    var kids = [];
    kids.push(h("button", { class: "link back", type: "button", text: "← Back", onclick: function () { view = { name: "list" }; armed = ""; render(); } }));
    kids.push(h("div", { class: "top" }, [
      h("div", { style: "display:flex;gap:10px;align-items:center;min-width:0" }, [av(hb), h("h2", { text: hb.name })]),
      h("button", { class: "btn", type: "button", text: "Edit", onclick: function () { view = { name: "form", id: hb.id }; render(); } })
    ]));
    kids.push(h("dl", { class: "stats" }, [
      stat("Streak", String(currentStreak(hb))), stat("Best", String(bestStreak(hb))),
      stat("30 days", score30(hb)), stat("Done", String(totalDone(hb)))
    ]));
    if (hb.archived) kids.push(h("div", { class: "banner" }, [
      h("span", { class: "note", text: "Archived. Hidden from Tracking and Overview, history kept." }),
      h("button", { class: "btn", type: "button", text: "Restore", onclick: function () { delete hb.archived; save(); render(); } })
    ]));
    if (hb.sched) kids.push(h("p", { class: "note", text: "Counts on " + hb.sched.slice().sort(function (a, b) { return ((a + 6) % 7) - ((b + 6) % 7); }).map(function (n) { return DAYNAMES[n].slice(0, 3); }).join(", ") + ". Other days are rest days." }));
    if (hb.type === "number") numberStats(hb, kids);
    var y = month.y, m = month.m;
    var first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
    var isCurrent = y === t.getFullYear() && m === t.getMonth();
    var cal = h("div", { class: "cal" });
    ["M", "T", "W", "T", "F", "S", "S"].forEach(function (w) { cal.appendChild(h("div", { class: "wd", text: w })); });
    for (var i = 0; i < offset; i++) cal.appendChild(h("div", { class: "gap" }));
    for (var d = 1; d <= dim; d++) {
      (function (day) {
        var k = y + "-" + pad(m + 1) + "-" + pad(day), s = st(hb, k);
        cal.appendChild(h("button", {
          class: "cell s" + s + (k === tk ? " today" : "") + (s === 0 && !sched(hb, new Date(y, m, day)) ? " off" : "") + (hb.notes && hb.notes[k] ? " hasnote" : ""), type: "button", disabled: k > tk,
          "aria-label": fmtLong(new Date(y, m, day)) + ": " + STATE_NAME[s],
          text: cellText(hb, k, s) || String(day), onclick: function () { cycle(hb, k); }
        }));
      })(d);
    }
    kids.push(h("div", { class: "panel" }, [
      h("div", { class: "cal-head" }, [
        h("button", { class: "btn", type: "button", "aria-label": "Previous month", text: "‹", onclick: function () { month = m === 0 ? { y: y - 1, m: 11 } : { y: y, m: m - 1 }; render(); } }),
        h("span", { class: "ttl", text: first.toLocaleDateString("en-GB", { month: "long", year: "numeric" }) }),
        h("button", { class: "btn", type: "button", "aria-label": "Next month", text: "›", disabled: isCurrent, onclick: function () { month = m === 11 ? { y: y + 1, m: 0 } : { y: y, m: m + 1 }; render(); } })
      ]),
      cal,
      h("p", { class: "note", text: hb.type === "number" ? "Tap a day to log an amount. Skipped days do not break a streak." : "Tap a day to cycle: done, missed, skip, cleared. Skipped days do not break a streak." })
    ]));
    chartPanel(hb, kids);
    weekdayPanel([hb], 365, "Best and worst weekday", hb.color, kids);
    if (hb.type === "number") recentLogs(hb, kids);
    notesPanel(hb, kids);
    return kids;
  }

  /* ---------- number habits ---------- */
  function fmtVal(v) { return String(Math.round(v * 100) / 100); }
  function reached(hb, v) { return v > 0 && (!hb.goal || v >= hb.goal); }
  function setLog(hb, k, v) {
    if (v === null) { if (hb.vals) delete hb.vals[k]; delete hb.days[k]; }
    else { hb.vals = hb.vals || {}; hb.vals[k] = v; hb.days[k] = reached(hb, v) ? 1 : 2; }
    if (hb.vals && !Object.keys(hb.vals).length) delete hb.vals;
    save();
  }
  function skipLog(hb, k) { if (hb.vals) { delete hb.vals[k]; if (!Object.keys(hb.vals).length) delete hb.vals; } hb.days[k] = 3; save(); }
  function recompute(hb) {
    if (!hb.vals) return;
    Object.keys(hb.vals).forEach(function (k) { if (hb.days[k] !== 3) hb.days[k] = reached(hb, hb.vals[k]) ? 1 : 2; });
  }
  function cellText(hb, k, s) {
    if (hb.type === "number" && s !== 3 && hb.vals && hb.vals[k] !== undefined) return fmtVal(hb.vals[k]);
    return GLYPH[s];
  }
  function pillText(hb, k, s, d) {
    var rest = s === 0 && !sched(hb, d);
    if (hb.type === "number") {
      if (s === 3) return "Skipped";
      var v = hb.vals && hb.vals[k];
      if (v !== undefined) return fmtVal(v) + (hb.unit ? " " + hb.unit : "");
      return rest ? "Day off" : "Log today";
    }
    return rest ? "Day off" : PILL[s];
  }
  function openLog(hb, k) { view = { name: "log", id: hb.id, key: k, back: view }; render(); window.scrollTo(0, 0); }

  function logView() {
    var hb = find(view.id);
    if (!hb || hb.type !== "number") { view = { name: "list" }; return listView(); }
    var k = view.key, d = parseKey(k), unit = hb.unit || "", cur = hb.vals && hb.vals[k];
    var step = hb.goal && hb.goal >= 20 ? 5 : 1;
    function back() { view = view.back || { name: "list" }; render(); }
    var inp = h("input", { type: "number", id: "logv", inputmode: "decimal", min: "0", step: "any", "aria-label": "Amount" + (unit ? " in " + unit : ""), value: cur !== undefined ? String(cur) : "", placeholder: hb.goal ? fmtVal(hb.goal) : "0" });
    var note = h("p", { class: "note", role: "status", text: hb.goal ? "Goal: " + fmtVal(hb.goal) + (unit ? " " + unit : "") + ". Reaching it marks the day done." : "Any amount above 0 marks the day done." });
    function bump(n) { var v = parseFloat(inp.value); if (isNaN(v)) v = 0; inp.value = String(Math.max(0, Math.round((v + n) * 100) / 100)); }
    var form = h("form", { onsubmit: function (e) {
      e.preventDefault();
      var v = parseFloat(inp.value);
      if (isNaN(v) || v < 0 || v > 1000000) { note.className = "note warn"; note.textContent = "Enter a number, or use Clear to remove the log."; return; }
      setLog(hb, k, Math.round(v * 100) / 100); back();
    } }, [
      h("div", { class: "logrow" }, [
        h("button", { class: "btn round", type: "button", "aria-label": "Less", text: "−", onclick: function () { bump(-step); } }),
        h("label", { class: "logbox" }, [inp, h("span", { class: "unit", text: unit })]),
        h("button", { class: "btn round", type: "button", "aria-label": "More", text: "+", onclick: function () { bump(step); } })
      ]),
      hb.goal ? h("button", { class: "btn small", type: "button", text: "Use goal (" + fmtVal(hb.goal) + ")", onclick: function () { inp.value = String(hb.goal); } }) : null,
      note,
      h("div", { class: "actions" }, [
        h("button", { class: "btn primary", type: "submit", text: "Save" }),
        h("button", { class: "btn", type: "button", text: "Skip day", onclick: function () { skipLog(hb, k); back(); } }),
        h("button", { class: "btn", type: "button", text: "Clear", onclick: function () { setLog(hb, k, null); back(); } })
      ]),
      h("button", { class: "link", type: "button", text: "Cancel", onclick: back })
    ]);
    return [
      h("div", null, [h("p", { class: "eyebrow", text: fmtLong(d) }), h("h2", { text: hb.name })]),
      h("div", { class: "panel" }, [form])
    ];
  }

  function numberStats(hb, kids) {
    var ks = Object.keys(hb.vals || {}), u = hb.unit ? " " + hb.unit : "", tot = 0, best = 0;
    ks.forEach(function (k) { var v = hb.vals[k]; tot += v; if (v > best) best = v; });
    kids.push(h("dl", { class: "stats three small" }, [
      stat("Total", fmtVal(tot) + u),
      stat("Average", ks.length ? fmtVal(tot / ks.length) + u : "–"),
      stat("Best day", ks.length ? fmtVal(best) + u : "–")
    ]));
  }
  function recentLogs(hb, kids) {
    var ks = Object.keys(hb.vals || {}).sort().reverse().slice(0, 10), u = hb.unit ? " " + hb.unit : "";
    if (!ks.length) return;
    var list = h("div", { class: "loglist" });
    ks.forEach(function (k) {
      list.appendChild(h("button", { class: "logitem", type: "button", "aria-label": "Edit log for " + fmtLong(parseKey(k)), onclick: function () { openLog(hb, k); } }, [
        h("span", { text: fmtLong(parseKey(k)) }), h("b", { text: fmtVal(hb.vals[k]) + u })
      ]));
    });
    kids.push(h("div", { class: "panel" }, [h("h3", { text: "Recent logs" }), list]));
  }

  function formView() {
    var hb = view.id ? find(view.id) : null;
    var color = hb ? hb.color : COLORS[data.habits.length % COLORS.length];
    var icn = hb && hb.icon ? hb.icon : "";
    var sel = hb && hb.sched ? hb.sched.slice() : [0, 1, 2, 3, 4, 5, 6];
    var typ = hb && hb.type === "number" ? "number" : "yesno";
    var nameIn = h("input", { type: "text", id: "hname", maxlength: "60", value: hb ? hb.name : "", placeholder: "For example: Stretch for 10 minutes", required: true });

    var unitIn = h("input", { type: "text", id: "hunit", maxlength: "12", value: hb && hb.unit ? hb.unit : "", placeholder: "min, pages, glasses" });
    var goalIn = h("input", { type: "number", id: "hgoal", inputmode: "decimal", min: "0", step: "any", value: hb && hb.goal ? String(hb.goal) : "", placeholder: "Optional, for example 20" });
    var typeNote = h("p", { class: "note", text: "A number habit lets you log an amount each day. With a goal, reaching it marks the day done." });
    var numFields = h("div", { class: "numfields", hidden: typ !== "number" }, [
      h("label", { class: "f", for: "hunit" }, ["Unit", unitIn]),
      h("label", { class: "f", for: "hgoal" }, ["Daily goal", goalIn]),
      typeNote
    ]);
    var typeBtns = [];
    function paintType() {
      typeBtns.forEach(function (b) { b.el.setAttribute("aria-pressed", b.id === typ ? "true" : "false"); });
      numFields.hidden = typ !== "number";
    }
    var typeSeg = h("div", { class: "seg two", role: "group", "aria-label": "Tracking type" });
    [["yesno", "Yes / No"], ["number", "Number"]].forEach(function (t) {
      var b = h("button", { type: "button", text: t[1], onclick: function () { typ = t[0]; paintType(); } });
      typeBtns.push({ id: t[0], el: b }); typeSeg.appendChild(b);
    });

    var tiles = [];
    function paintTiles() {
      tiles.forEach(function (t) {
        var on = t.id === icn;
        t.el.setAttribute("aria-pressed", on ? "true" : "false");
        t.el.style.background = on ? color : "";
        t.el.style.color = on ? "#fff" : "";
      });
    }
    var iconGrid = h("div", { class: "icons", role: "group", "aria-label": "Icon" });
    [{ id: "", p: null }].concat(ICONS).forEach(function (ic) {
      var b = h("button", { class: "itile", type: "button", "aria-label": ic.id ? "Icon: " + ic.id : "First letter of the name", onclick: function () { icn = ic.id; paintTiles(); } },
        [ic.p ? icon(ic.p) : h("span", { text: "Aa" })]);
      tiles.push({ id: ic.id, el: b });
      iconGrid.appendChild(b);
    });

    var sw = h("div", { class: "swatches", role: "radiogroup", "aria-label": "Colour" });
    COLORS.forEach(function (c, i) {
      var r = h("input", { type: "radio", name: "color", value: c, "aria-label": "Colour " + (i + 1) });
      if (c.toLowerCase() === color.toLowerCase()) r.checked = true;
      r.addEventListener("change", function () { color = c; paintTiles(); });
      sw.appendChild(h("label", { class: "sw" }, [r, h("span", { style: "background:" + c })]));
    });

    var dayBtns = [], order = [1, 2, 3, 4, 5, 6, 0], lbl = ["M", "T", "W", "T", "F", "S", "S"];
    var dayNote = h("p", { class: "note", role: "status", text: "Days you leave out are rest days. They never break a streak or count against your score." });
    function paintDays() {
      dayBtns.forEach(function (d) { d.el.setAttribute("aria-pressed", sel.indexOf(d.n) > -1 ? "true" : "false"); });
    }
    var dayRow = h("div", { class: "dayrow", role: "group", "aria-label": "Days this habit counts" });
    order.forEach(function (n, i) {
      var b = h("button", { class: "dbtn", type: "button", "aria-label": DAYNAMES[n], text: lbl[i], onclick: function () {
        var j = sel.indexOf(n); if (j > -1) sel.splice(j, 1); else sel.push(n);
        paintDays(); dayNote.className = "note"; dayNote.textContent = "Days you leave out are rest days. They never break a streak or count against your score.";
      } });
      dayBtns.push({ n: n, el: b });
      dayRow.appendChild(b);
    });
    function preset(label, arr) { return h("button", { class: "btn small", type: "button", text: label, onclick: function () { sel = arr.slice(); paintDays(); } }); }
    var presets = h("div", { class: "actions" }, [preset("Every day", [0, 1, 2, 3, 4, 5, 6]), preset("Weekdays", [1, 2, 3, 4, 5]), preset("Weekends", [6, 0])]);

    var form = h("form", { onsubmit: function (e) {
      e.preventDefault();
      var name = nameIn.value.trim();
      if (!name) { nameIn.focus(); return; }
      if (!sel.length) { dayNote.className = "note warn"; dayNote.textContent = "Pick at least one day."; return; }
      var unit = unitIn.value.trim().slice(0, 12), goal = parseFloat(goalIn.value);
      if (!(goal > 0) || goal > 1000000) goal = null;
      if (typ === "number" && !unit) { typeNote.className = "note warn"; typeNote.textContent = "Add a unit, like min or pages."; unitIn.focus(); return; }
      var sc = sel.length === 7 ? null : sel.slice().sort(function (a, b) { return a - b; });
      if (hb) {
        hb.name = name; hb.color = color; hb.example = false;
        if (icn) hb.icon = icn; else delete hb.icon;
        if (sc) hb.sched = sc; else delete hb.sched;
        if (typ === "number") { hb.type = "number"; hb.unit = unit; if (goal) hb.goal = goal; else delete hb.goal; recompute(hb); }
        else { delete hb.type; delete hb.unit; delete hb.goal; }
        save(); view = { name: "detail", id: hb.id };
        if (!month) { var n = today(); month = { y: n.getFullYear(), m: n.getMonth() }; }
      } else {
        var nh = { id: uid(), name: name, color: color, created: key(today()), days: {}, example: false };
        if (icn) nh.icon = icn;
        if (sc) nh.sched = sc;
        if (typ === "number") { nh.type = "number"; nh.unit = unit; if (goal) nh.goal = goal; }
        data.habits.push(nh); save(); view = { name: "list" };
      }
      render();
    } }, [
      h("label", { class: "f", for: "hname" }, ["Name", nameIn]),
      h("div", { class: "f" }, ["Tracking", typeSeg, numFields]),
      h("div", { class: "f" }, ["Icon", iconGrid]),
      h("div", { class: "f" }, ["Colour", sw]),
      h("div", { class: "f" }, ["Days it counts", dayRow, presets, dayNote]),
      h("div", { class: "actions" }, [
        h("button", { class: "btn primary", type: "submit", text: hb ? "Save" : "Add habit" }),
        h("button", { class: "btn", type: "button", text: "Cancel", onclick: function () { view = hb ? { name: "detail", id: hb.id } : { name: "list" }; render(); } })
      ])
    ]);
    paintTiles(); paintDays(); paintType();
    var kids = [h("h2", { text: hb ? "Edit habit" : "New habit" }), h("div", { class: "panel" }, [form])];
    if (hb) {
      kids.push(h("div", { class: "panel" }, [
        h("button", { class: "btn", type: "button", text: hb.archived ? "Restore habit" : "Archive habit", onclick: function () {
          if (hb.archived) { delete hb.archived; save(); view = { name: "detail", id: hb.id }; }
          else { hb.archived = true; lastArchived = hb.id; save(); tab = "tracking"; view = { name: "list" }; }
          render(); window.scrollTo(0, 0);
        } }),
        h("p", { class: "note", text: "Archiving hides the habit but keeps all its history. Restore it any time from Account." }),
        h("button", { class: "btn danger" + (armed === "del" ? " armed" : ""), type: "button", text: armed === "del" ? "Tap again to delete for good" : "Delete habit", onclick: function () {
          if (armed === "del") {
            clearTimeout(armTimer); armed = "";
            data.habits = data.habits.filter(function (x) { return x.id !== hb.id; }); save(); view = { name: "list" }; render();
          } else arm("del");
        } }),
        h("p", { class: "note", text: "Deleting removes the habit and all its marked days." })
      ]));
    }
    return kids;
  }

  /* ---------- shell ---------- */
  var navThumb = null, navBtns = [];
  function goTab(id) { reorder = false; lastArchived = ""; tab = id; view = { name: "list" }; armed = ""; msg = ""; render(); window.scrollTo(0, 0); }
  function paintTabs(idx) {
    navBtns.forEach(function (b, i) { if (i === idx) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  }
  function buildTabs() {
    var nav = document.getElementById("tabs");
    nav.textContent = "";
    navThumb = h("div", { class: "thumb" });
    nav.appendChild(navThumb);
    navBtns = TABS.map(function (t) {
      var b = h("button", { class: "tab", type: "button", onclick: function () { goTab(t.id); } }, [icon(t.ic), t.label]);
      nav.appendChild(b);
      return b;
    });
    var st = null;
    function geo() { var w = (nav.clientWidth - 8) / 3; return { w: w, step: w + 4 }; }
    function curIdx() { for (var i = 0; i < TABS.length; i++) if (TABS[i].id === tab) return i; return 0; }
    nav.addEventListener("pointerdown", function (e) {
      if (e.button) return;
      st = { x: e.clientX, base: curIdx() * geo().step, moved: false, idx: curIdx(), id: e.pointerId };
    });
    nav.addEventListener("pointermove", function (e) {
      if (!st) return;
      var dx = e.clientX - st.x, g = geo();
      if (!st.moved) {
        if (Math.abs(dx) < 6) return;
        st.moved = true;
        try { nav.setPointerCapture(st.id); } catch (err) {}
        navThumb.classList.add("drag");
      }
      var off = Math.max(0, Math.min(g.step * (TABS.length - 1), st.base + dx));
      navThumb.style.transform = "translateX(" + off + "px) scale(1.06)";
      var idx = Math.round(off / g.step);
      if (idx !== st.idx) { st.idx = idx; paintTabs(idx); try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) {} }
    });
    function end() {
      if (!st) return;
      var s2 = st; st = null;
      if (!s2.moved) return;
      navThumb.classList.remove("drag");
      navThumb.style.transform = "";
      navThumb.style.setProperty("--i", s2.idx);
      goTab(TABS[s2.idx].id);
    }
    nav.addEventListener("pointerup", end);
    nav.addEventListener("pointercancel", end);
  }
  function renderTabs() {
    if (!navThumb) buildTabs();
    var idx = 0;
    TABS.forEach(function (t, i) { if (t.id === tab) idx = i; });
    navThumb.style.setProperty("--i", idx);
    paintTabs(idx);
  }
  function render() {
    renderedDay = key(today());
    var app = document.getElementById("app");
    var kids = view.name === "note" ? noteView() : view.name === "log" ? logView() : view.name === "detail" ? detailView() : view.name === "form" ? formView()
      : tab === "overview" ? overviewView() : tab === "account" ? accountView() : listView();
    app.textContent = "";
    kids.forEach(function (k) { app.appendChild(k); });
    renderTabs();
    if (view.name === "form") { var f = document.getElementById("hname"); if (f && !f.value) f.focus(); }
  }

  var lastLeft = 0;
  function checkDay() {
    if (key(today()) !== renderedDay && ["form", "log", "note"].indexOf(view.name) < 0 && !reorder) { render(); return true; }
    return false;
  }
  setInterval(function () {
    if (checkDay()) return;
    if (view.name === "list" && tab === "tracking" && !reorder) { var l = remindLeft(); if (l !== lastLeft) { lastLeft = l; render(); } }
  }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });
  window.addEventListener("pageshow", checkDay);
  window.addEventListener("focus", checkDay);
  data = load();
  save();
  applySettings();
  render();
  showSplash();
})();
</script>
